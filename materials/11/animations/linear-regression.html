<style>html,body{margin:0;height:100%;background:#1c1e24;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
<canvas id="c"></canvas>
<script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d'),W,H,U,
B='#58c4dd',Y='#f4d35e',GR='#83c167',R='#fc6255',F='#ececec',A='#6d7480',M='#9aa1ad',BG='#1c1e24',
MF='"Times New Roman",serif',HF='"David","Times New Roman",serif',L='⁦',P='⁩',m='−';
function rs(){var d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);U=W/8.6}
function cl(x){return x<0?0:x>1?1:x}function ez(x){x=cl(x);return x*x*(3-2*x)}function sg(t,a,b){return cl((t-a)/(b-a))}
// plot area: data x in [0,10], y in [0,10]
function X(x){return W*.2+x*(W*.6/10)}function Yp(y){return H*.8-y*(H*.68/10)}
function frame(a){g.save();g.globalAlpha=a;g.strokeStyle=A;g.lineWidth=U*.02;g.beginPath();g.moveTo(X(0),Yp(10.3));g.lineTo(X(0),Yp(0));g.lineTo(X(10.3),Yp(0));g.stroke();g.restore();
tx('x',X(10.4),Yp(0)+U*.05,M,.26,a);tx('y',X(0),Yp(10.6),M,.26,a)}
function tx(s,x,y,c,sz,a,heb){if(a<=0)return;g.save();g.globalAlpha=a;g.fillStyle=c;g.font=(heb?'bold ':'italic ')+U*sz+'px '+(heb?HF:MF);g.direction=heb?'rtl':'ltr';g.textAlign='center';g.textBaseline='middle';g.fillText(s,x,y);g.restore()}
function dot(x,y,c,r,a){g.save();g.globalAlpha=a;g.fillStyle=c;g.shadowColor=c;g.shadowBlur=U*.12;g.beginPath();g.arc(X(x),Yp(y),U*r,0,7);g.fill();g.restore()}
function seg(x0,y0,x1,y1,c,w,a,d){if(a<=0)return;g.save();g.globalAlpha=a;g.strokeStyle=c;g.lineWidth=U*w;g.lineCap='round';if(d)g.setLineDash([U*.07,U*.06]);g.shadowColor=c;g.shadowBlur=d?0:U*.1;g.beginPath();g.moveTo(X(x0),Yp(y0));g.lineTo(X(x1),Yp(y1));g.stroke();g.restore()}
var BX=[1,1.8,2.6,3.2,4,4.6,5.3,6,6.7,7.4,8.2,9],N=[.6,-.9,.4,-.3,.9,-.7,.2,-.5,.8,-.2,.5,-.8];
function pts(rho){return BX.map(function(x,k){var base=1.5+.7*x;var y=rho>=0?base+N[k]*(1+4*(1-rho)):9.5-.7*x+N[k]*(1+4*(1+rho));return[x,Math.max(.4,Math.min(9.6,y))]})}
function stats(P){var n=P.length,mx=0,my=0;P.forEach(function(p){mx+=p[0];my+=p[1]});mx/=n;my/=n;var sxx=0,syy=0,sxy=0;P.forEach(function(p){sxx+=(p[0]-mx)*(p[0]-mx);syy+=(p[1]-my)*(p[1]-my);sxy+=(p[0]-mx)*(p[1]-my)});
var sx=Math.sqrt(sxx/n),sy=Math.sqrt(syy/n),r=sxy/Math.sqrt(sxx*syy),mm=r*sy/sx;return{mx:mx,my:my,r:r,m:mm,b:my-mm*mx}}
function line(s,mm,a,c){var b=s.my-mm*s.mx;seg(0,b,10,b+10*mm,c||Y,.04,a)}
function draw(P,a,c){P.forEach(function(p,k){dot(p[0],p[1],c||B,.08,a)})}
function fmt(v){return(v<0?m:'')+Math.abs(v).toFixed(2)}
var P0=pts(.95);
var SC=[
[8,[[0,'דיאגרמת פיזור: כל נקודה היא זוג '+L+'(x, y)'+P],[4,'הנקודות עולות משמאל לימין: קשר חיובי']],function(t){frame(1);P0.forEach(function(p,k){dot(p[0],p[1],B,.08,ez(sg(t,.3+k*.25,.8+k*.25)))})}],
[11,[[0,'מסמנים את הממוצעים '+L+'x̄'+P+' ו־'+L+'ȳ'+P],[4,'הנקודה '+L+'(x̄, ȳ)'+P+' היא מרכז הענן'],[7,'רוב הנקודות ברבעים של ++ ו־'+m+m+': לכן r חיובי']],function(t){frame(1);var s=stats(P0),a=ez(sg(t,.5,1.5));
seg(s.mx,0,s.mx,10,M,.02,a,1);seg(0,s.my,10,s.my,M,.02,a,1);tx('x̄',X(s.mx),Yp(0)+U*.3,M,.3,a);tx('ȳ',X(0)-U*.3,Yp(s.my),M,.3,a);
if(t>7){g.save();g.globalAlpha=.14*ez(sg(t,7,8));g.fillStyle=GR;g.fillRect(X(s.mx),Yp(10),X(10)-X(s.mx),Yp(s.my)-Yp(10));g.fillRect(X(0),Yp(s.my),X(s.mx)-X(0),Yp(0)-Yp(s.my));g.restore()}
draw(P0,1);dot(s.mx,s.my,Y,.13,ez(sg(t,4,4.6)))}],
[13,[[0,'קו הרגרסיה: הישר שהכי קרוב לכל הנקודות'],[2,'מסובבים ישר סביב '+L+'(x̄, ȳ)'+P+'… המרחקים מהנקודות משתנים'],[8,'בשיפוע הנכון '+L+'m'+P+', המרחקים הכי קטנים']],function(t){frame(1);var s=stats(P0),mm=t<2?0:(t<8?s.m+1.2*Math.sin((t-2)*1.4)*(1-sg(t,6,8)):s.m);
P0.forEach(function(p){var yl=s.my+mm*(p[0]-s.mx);seg(p[0],p[1],p[0],yl,R,.022,.85)});line(s,mm,1);draw(P0,1);dot(s.mx,s.my,Y,.12,1);
tx('m = '+fmt(mm),X(8.3),Yp(1.5),Y,.34,1)}],
[14,[[0,'מקדם המתאם r: כמה הנקודות קרובות לישר'],[3,'ככל שהענן מתפזר, r מתקרב ל־0'],[9,'כשהנקודות יורדות, r שלילי']],function(t){frame(1);var rho=t<3?.95:(t<8?.95-.9*ez(sg(t,3,7)):.05-1*ez(sg(t,8.5,12)));var P=pts(rho),s=stats(P);
line(s,s.m,.8,Y);draw(P,1,rho<0?R:B);tx('r = '+fmt(s.r),X(8.2),Yp(9.6),rho<0?R:B,.42,1)}],
[13,[[0,'חיזוי: מציבים x בקו ומקבלים y'],[2,'למשל '+L+'x = 6.5'+P+': עולים עד הקו, ופונים לציר y'],[7.5,'מחוץ לתחום הנתונים אין לחזות: לא יודעים אם הקשר נמשך']],function(t){frame(1);var s=stats(P0);line(s,s.m,1);draw(P0,1);
var xp=6.5,yp=s.b+s.m*xp,a=ez(sg(t,2,3)),b=ez(sg(t,3,4.5));seg(xp,0,xp,yp*a,GR,.035,a,1);if(t>3)seg(xp,yp,xp-(xp)*b,yp,GR,.035,1,1);dot(xp,yp,GR,.1,a);tx('y ≈ '+yp.toFixed(1),X(0)-U*.45,Yp(yp),GR,.3,b);
var c=ez(sg(t,7.5,8.5));if(c>0){g.save();g.globalAlpha=.18*c;g.fillStyle=R;g.fillRect(X(9.2),Yp(10.3),X(10.3)-X(9.2),Yp(0)-Yp(10.3));g.restore();tx('?',X(9.75),Yp(5),R,.6,c)}}]
];
var i=0,t=0,last=null;
function cap(){var c=SC[i][1],s=c[0][1];for(var k=0;c.length>k;k++)if(t>=c[k][0])s=c[k][1];return s}
function fr(ts){if(last!=null)t+=Math.min(.1,(ts-last)/1000);last=ts;if(t>=SC[i][0]){i=(i+1)%SC.length;t=0}
g.fillStyle=BG;g.fillRect(0,0,W,H);SC[i][2](t);
g.save();g.globalAlpha=ez(sg(t,0,.4));g.fillStyle=F;g.font='bold '+Math.max(26,U*.26)+'px '+HF;g.direction='rtl';g.textAlign='center';g.textBaseline='middle';g.fillText(cap(),W/2,H*.91);g.restore();
for(var k=0;SC.length>k;k++){g.fillStyle=k==i?B:'#3a3f49';g.beginPath();g.arc(W/2+(2-k)*U*.18,H*.975,U*.035,0,7);g.fill()}
if(t<.4){g.fillStyle='rgba(28,30,36,'+(1-t/.4)+')';g.fillRect(0,0,W,H*.86)}
requestAnimationFrame(fr)}
addEventListener('resize',rs);rs();requestAnimationFrame(fr);
})();
</script>
